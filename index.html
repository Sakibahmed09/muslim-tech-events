<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muslim Tech Event Generator</title>

<meta name="twitter:description" content="Pull the lever. Name your next one.">
<meta name="twitter:image" content="https://sakib.lol/muslim-tech-events/og.png">
<meta name="theme-color" content="#15101c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='12' fill='%23c4122f' stroke='%23f2c14e' stroke-width='5'/%3E%3Ctext x='32' y='43' font-family='Impact,Arial Black,Arial' font-size='28' text-anchor='middle' fill='%23f2c14e'%3E777%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bebas+Neue&family=Courier+Prime:wght@400;700&family=VT323&display=swap">
<style>
:root {
  color-scheme: dark;
  --ground: #15101c;
  --ground-glow: #3b1a34;
  --red: #c4122f;
  --red-dk: #820a1e;
  --gold: #f2c14e;
  --gold-dk: #a87624;
  --cream: #f7efdd;
  --paper: #fbf4e3;
  --ink: #1b1522;
  --muted: #a896a8;
  --led: #ffae3d;
  --bulb-on: #ffecaa;
  --bulb-off: #5c3a22;
  --display: "Anton", "Impact", "Arial Narrow Bold", sans-serif;
  --label: "Bebas Neue", "Oswald", "Arial Narrow", sans-serif;
  --heavy: "Archivo Black", "Arial Black", system-ui, sans-serif;
  --type: "Courier Prime", "Courier New", ui-monospace, monospace;
  --pixel: "VT323", ui-monospace, monospace;
  --lever-w: 56px;
  --L: 150px;
}
@media (max-width: 560px) {
  :root { --lever-w: 44px; --L: 108px; }
}
* { box-sizing: border-box; }
html { min-height: 100%; background: var(--ground); }
body {
  margin: 0;
  min-height: 100%;
  background: radial-gradient(ellipse 90% 60% at 50% 22%, var(--ground-glow), var(--ground) 70%) no-repeat, var(--ground);
  color: var(--cream);
  font-family: var(--label);
  padding-inline: 16px;
  padding-block: 28px 44px;
  -webkit-tap-highlight-color: transparent;
}
main {
  max-width: 660px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 26px;
}
.console {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-right: var(--lever-w);
}

.rig {
  container-type: inline-size;
  position: relative;
  width: min(520px, 100%);
  z-index: 2;
}
.machine {
  position: relative;
  background: var(--red);
  border: 1.8cqw solid var(--gold);
  border-radius: 9cqw;
  padding: 5cqw 4.5cqw 0;
  box-shadow: 1.6cqw 2.6cqw 0 #0a070e, inset 0 0 0 0.5cqw #e2324d;
  display: flex;
  flex-direction: column;
  gap: 4cqw;
  overflow: hidden;
}

.marquee {
  position: relative;
  background: var(--ink);
  border: 1.1cqw solid var(--gold);
  border-radius: 5cqw;
  padding: 7.5cqw 5cqw 7cqw;
  text-align: center;
}
.marquee h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  color: var(--gold);
  font-size: 13cqw;
  line-height: 0.95;
  letter-spacing: 0.01em;
  text-shadow: 0 0 3cqw rgba(242, 193, 78, 0.35);
}
.marquee p {
  margin: 1.2cqw 0 0;
  font-size: 6.4cqw;
  letter-spacing: 0.08em;
  line-height: 1;
}
.bulbs { position: absolute; inset: 0; pointer-events: none; }
.bulb {
  position: absolute;
  width: 2.5cqw;
  height: 2.5cqw;
  margin: -1.25cqw 0 0 -1.25cqw;
  border-radius: 50%;
  background: var(--bulb-off);
}
.bulb.on {
  background: var(--bulb-on);
  box-shadow: 0 0 1.6cqw 0.6cqw rgba(255, 200, 90, 0.55);
}

.led {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  background: #0c080f;
  border: 0.8cqw solid var(--gold-dk);
  border-radius: 2.4cqw;
  font-family: var(--pixel);
  font-size: 6.2cqw;
  line-height: 1;
  color: var(--led);
  text-shadow: 0 0 1.4cqw rgba(255, 150, 40, 0.75);
  overflow: hidden;
}
.ticker {
  position: relative;
  height: 8.4cqw;
  overflow: hidden;
  white-space: nowrap;
}
.ticker span {
  position: absolute;
  left: 0;
  top: 50%;
  transform: translate(100%, -52%);
  will-change: transform;
}
.count {
  padding: 0 2.6cqw 0 2.2cqw;
  border-left: 0.5cqw solid #3a2616;
  color: #ffd27a;
  height: 100%;
  display: flex;
  align-items: center;
}

.bezel {
  position: relative;
  background: var(--ink);
  border: 1.1cqw solid var(--gold);
  border-radius: 4.5cqw;
  padding: 3cqw 2.6cqw 2.6cqw;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2.4cqw 2cqw;
}
.arrow {
  position: absolute;
  top: 21cqw;
  width: 0; height: 0;
  border-block: 3.2cqw solid transparent;
  transform: translateY(-50%);
}
.arrow.l { left: -1.1cqw; border-left: 3.8cqw solid var(--gold); }
.arrow.r { right: -1.1cqw; border-right: 3.8cqw solid var(--gold); }

.window {
  position: relative;
  height: 36cqw;
  background: var(--cream);
  border-radius: 2.6cqw;
  box-shadow: 0 0 0 0.7cqw var(--gold-dk);
  overflow: hidden;
}
.window::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(180deg,
    rgba(27, 21, 34, 0.74) 0%, rgba(27, 21, 34, 0.2) 24%, rgba(27, 21, 34, 0) 42%,
    rgba(27, 21, 34, 0) 58%, rgba(27, 21, 34, 0.2) 76%, rgba(27, 21, 34, 0.74) 100%);
}
.reel { position: absolute; inset: 0; }
.cell {
  position: absolute;
  left: 0; right: 0; top: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--display);
  color: var(--ink);
  text-transform: uppercase;
  line-height: 1;
  white-space: nowrap;
  will-change: transform;
}
.window.held { box-shadow: 0 0 0 0.7cqw var(--bulb-on), 0 0 3cqw rgba(255, 220, 120, 0.6); }
.win .cell.hit { color: var(--red); }

.hold {
  font-family: var(--label);
  font-size: 5.4cqw;
  letter-spacing: 0.12em;
  line-height: 1;
  padding: 1.5cqw 0 1cqw;
  border-radius: 1.8cqw;
  background: #3a2a1a;
  color: #caa865;
  border: 0.5cqw solid var(--gold-dk);
  box-shadow: 0 0.9cqw 0 #120c08;
  cursor: pointer;
  transition: transform 0.08s, box-shadow 0.08s, background 0.12s;
}
.hold:hover { background: #4a3520; }
.hold[aria-pressed="true"] {
  background: var(--bulb-on);
  color: var(--ink);
  border-color: var(--gold);
  box-shadow: 0 0 2.6cqw rgba(255, 210, 110, 0.8), 0 0.3cqw 0 #120c08;
  transform: translateY(0.6cqw);
}
.hold:disabled { cursor: default; opacity: 0.55; }
.hold[aria-pressed="true"]:disabled { opacity: 1; }

.plate {
  background: var(--ink);
  border: 0.9cqw solid var(--gold);
  border-radius: 3.6cqw;
  min-height: 17cqw;
  padding: 2cqw 3cqw;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-family: var(--heavy);
  font-size: 4.6cqw;
  line-height: 1.15;
  color: var(--gold);
  text-transform: uppercase;
  text-wrap: balance;
}
.plate.pending { font-family: var(--label); color: #8a7690; font-size: 6cqw; letter-spacing: 0.06em; }

.tray {
  background: var(--red-dk);
  margin: 0 -4.5cqw;
  padding: 4cqw 4.5cqw 3.6cqw;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2.6cqw;
}
.spin {
  font-family: var(--display);
  font-size: 7.6cqw;
  letter-spacing: 0.06em;
  line-height: 1.15;
  color: var(--ink);
  background: var(--gold);
  border: 0;
  border-radius: 99px;
  padding: 1.4cqw 12cqw;
  box-shadow: 0 1.2cqw 0 var(--gold-dk);
  cursor: pointer;
  transition: transform 0.08s, box-shadow 0.08s, filter 0.2s;
}
.spin:hover { filter: brightness(1.07); }
.spin:active, .spin.pressed { transform: translateY(1cqw); box-shadow: 0 0.2cqw 0 var(--gold-dk); }
.spin:disabled { cursor: default; filter: saturate(0.55) brightness(0.8); }
.hint {
  font-size: 4.4cqw;
  letter-spacing: 0.1em;
  color: rgba(247, 239, 221, 0.62);
  line-height: 1;
}
.slot {
  width: 64%;
  height: 2.6cqw;
  border-radius: 99px;
  background: #07040a;
  box-shadow: inset 0 0.7cqw 0.9cqw #000, 0 0.3cqw 0 rgba(255, 255, 255, 0.08);
}

.lever {
  position: absolute;
  top: 0; bottom: 0;
  right: calc(var(--lever-w) * -1);
  width: var(--lever-w);
  background: none;
  border: 0;
  padding: 0;
  cursor: grab;
  touch-action: none;
}
.lever:active { cursor: grabbing; }
.lever .base {
  position: absolute;
  left: 0;
  top: 46%;
  width: 40%;
  height: 58px;
  margin-top: -29px;
  background: var(--gold);
  border: 3px solid var(--gold-dk);
  border-left: 0;
  border-radius: 0 10px 10px 0;
}
.lever .arm { position: absolute; left: 50%; top: 46%; width: 0; height: 0; }
.lever .stick {
  position: absolute;
  left: -4px;
  bottom: 0;
  width: 8px;
  height: var(--L);
  border-radius: 4px;
  background: linear-gradient(90deg, #f4f4f8, #a9a9b6);
  transform-origin: 50% 100%;
}
.lever .knob {
  position: absolute;
  left: -17px;
  top: calc(var(--L) * -1 - 17px);
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ff9aa8 0 16%, var(--red) 42%, #8e0c22 100%);
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
}
.lever .pivot {
  position: absolute;
  left: -11px;
  top: -11px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--gold);
  border: 4px solid var(--gold-dk);
}
.lever.pulled .stick { animation: stick 0.42s ease-in-out; }
.lever.pulled .knob { animation: knob 0.42s ease-in-out; }
.lever.releasing .stick, .lever.releasing .knob { transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes stick { 50% { transform: scaleY(-0.96); } }
@keyframes knob { 50% { transform: translateY(calc(var(--L) * 1.96)); } }

.ticket-wrap {
  width: min(440px, 100%);
  margin-top: -1cqw;
  padding: 0 10px 22px;
  overflow: hidden;
  position: relative;
  z-index: 1;
}
.ticket {
  position: relative;
  background: var(--paper);
  color: var(--ink);
  border-radius: 6px;
  padding: 16px 20px 16px;
  box-shadow: 0 12px 26px rgba(0, 0, 0, 0.5);
  font-family: var(--type);
  font-size: 14.5px;
  line-height: 1.35;
}
.ticket.printing { animation: print 1.05s steps(14, end) both; }
.ticket.gone { animation: gone 0.32s ease-in forwards; }
@keyframes print { from { transform: translateY(-101%); } to { transform: translateY(0); } }
@keyframes gone { to { transform: translate(18px, 26px) rotate(5deg); opacity: 0; } }
.ticket.golden {
  background: linear-gradient(115deg, #e9b949 0%, #f7d97e 22%, #fff3c4 38%, #f2c14e 55%, #d9a13a 78%, #f5d273 100%);
  background-size: 220% 100%;
  animation: shimmer 3.2s linear infinite;
}
.ticket.golden.printing { animation: print 1.05s steps(14, end) both, shimmer 3.2s linear infinite; }
@keyframes shimmer { from { background-position: 0% 0; } to { background-position: 220% 0; } }
.t-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: var(--label);
  font-size: 19px;
  letter-spacing: 0.12em;
  color: var(--red);
  border-bottom: 2px solid var(--red);
  padding-bottom: 6px;
}
.t-name {
  margin: 12px 0 12px;
  font-family: var(--display);
  font-weight: 400;
  font-size: 34px;
  line-height: 1.02;
  text-transform: uppercase;
  text-wrap: balance;
}
.t-rows { margin: 0; display: grid; gap: 7px; }
.t-row { display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: baseline; }
.t-row dt {
  font-family: var(--label);
  font-size: 17px;
  letter-spacing: 0.1em;
  color: var(--red);
}
.t-row dd { margin: 0; }
.t-fine {
  margin: 14px 0 0;
  font-size: 13px;
  font-style: italic;
  color: rgba(27, 21, 34, 0.72);
}
.tear {
  position: relative;
  margin: 14px -20px 12px;
  border-top: 2px dashed rgba(27, 21, 34, 0.28);
}
.tear::before, .tear::after {
  content: "";
  position: absolute;
  top: -10px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--ground);
}
.tear::before { left: -9px; }
.tear::after { right: -9px; }
.t-stub {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 12px;
}
.barcode { display: flex; align-items: stretch; height: 38px; gap: 2px; }
.barcode i { display: block; background: var(--ink); }
.t-site {
  font-family: var(--label);
  font-size: 14px;
  letter-spacing: 0.08em;
  text-align: right;
  line-height: 1.1;
  color: rgba(27, 21, 34, 0.7);
}
.stamp {
  position: absolute;
  bottom: 22px;
  left: 50%;
  margin-left: -8px;
  max-width: 42%;
  padding: 5px 8px 4px;
  border: 3px solid var(--red);
  border-radius: 6px;
  color: var(--red);
  font-family: var(--heavy);
  font-size: 13px;
  line-height: 1.1;
  text-align: center;
  letter-spacing: 0.04em;
  transform: translateX(-30%) rotate(-7deg);
  opacity: 0.9;
  mix-blend-mode: multiply;
}
.stamp.slam { animation: slam 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.2) both; }
@keyframes slam { from { transform: translateX(-30%) rotate(-7deg) scale(2.2); opacity: 0; } to { transform: translateX(-30%) rotate(-7deg) scale(1); opacity: 0.9; } }

.actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}
.actions a, .actions button {
  font-family: var(--label);
  font-size: 22px;
  letter-spacing: 0.06em;
  line-height: 1;
  text-decoration: none;
  color: var(--cream);
  background: transparent;
  border: 2px solid rgba(247, 239, 221, 0.35);
  border-radius: 99px;
  padding: 10px 20px 8px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, color 0.15s;
}
.actions a:hover, .actions button:hover { border-color: var(--gold); background: rgba(242, 193, 78, 0.08); }
.actions .primary { background: var(--cream); color: var(--ink); border-color: var(--cream); }
.actions .primary:hover { background: var(--gold); border-color: var(--gold); color: var(--ink); }

.history { width: 100%; max-width: 460px; text-align: center; }
.history h2 {
  margin: 0 0 10px;
  font-weight: 400;
  font-size: 18px;
  letter-spacing: 0.14em;
  color: var(--muted);
}
.history ol {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-family: var(--heavy);
  font-size: 14px;
  color: rgba(247, 239, 221, 0.7);
}
.history li:first-child { color: var(--cream); }
.history li.gold { color: var(--gold); }

footer {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  font-size: 18px;
  letter-spacing: 0.08em;
  color: var(--muted);
  text-align: center;
}
footer .row { display: flex; gap: 18px; align-items: center; }
footer a { color: var(--cream); text-decoration: none; border-bottom: 1px solid rgba(247, 239, 221, 0.35); }
footer a:hover { border-color: var(--gold); }
footer button {
  font: inherit;
  letter-spacing: inherit;
  color: var(--muted);
  background: none;
  border: 0;
  cursor: pointer;
  padding: 0;
}
footer small { font-family: var(--type); font-size: 12px; letter-spacing: 0; font-style: italic; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  max-width: min(440px, calc(100vw - 32px));
  transform: translate(-50%, 20px);
  background: var(--cream);
  color: var(--ink);
  font-size: 20px;
  letter-spacing: 0.05em;
  line-height: 1.15;
  text-align: center;
  padding: 10px 20px 8px;
  border-radius: 18px;
  opacity: 0;
  pointer-events: none;
  z-index: 60;
  transition: opacity 0.2s, transform 0.25s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.big { background: var(--gold); box-shadow: 0 0 0 4px var(--red), 0 14px 30px rgba(0, 0, 0, 0.5); font-size: 22px; }
.toast .kicker { display: block; font-size: 15px; letter-spacing: 0.16em; color: var(--red); margin-bottom: 2px; }

#fx { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 50; }

button:focus-visible, a:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }

@media (max-width: 380px) {
  .t-row { grid-template-columns: 1fr; gap: 0; }
  .t-name { font-size: 29px; }
}
@media (prefers-reduced-motion: reduce) {
  .lever.pulled .stick, .lever.pulled .knob, .ticket.printing, .ticket.gone, .stamp.slam { animation: none; }
  .ticket.golden { animation: none; }
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<main>
  <div class="console">
    <div class="rig" id="rig">
      <div class="machine" id="machine">
        <header class="marquee" id="marquee">
          <div class="bulbs" id="bulbs" aria-hidden="true"></div>
          <h1>MUSLIM TECH</h1>
          <p>EVENT GENERATOR</p>
        </header>
        <div class="led" aria-hidden="true">
          <div class="ticker" id="ticker"><span id="tickerText"></span></div>
          <div class="count" id="count">No.000</div>
        </div>
        <div class="bezel">
          <span class="arrow l" aria-hidden="true"></span>
          <span class="arrow r" aria-hidden="true"></span>
          <div class="window" aria-hidden="true"><div class="reel" id="reel0"></div></div>
          <div class="window" aria-hidden="true"><div class="reel" id="reel1"></div></div>
          <div class="window" aria-hidden="true"><div class="reel" id="reel2"></div></div>
          <button class="hold" type="button" aria-pressed="false" data-i="0">HOLD</button>
          <button class="hold" type="button" aria-pressed="false" data-i="1">HOLD</button>
          <button class="hold" type="button" aria-pressed="false" data-i="2">HOLD</button>
        </div>
        <div class="plate" id="plate" aria-live="polite"></div>
        <div class="tray" id="tray">
          <button class="spin" id="spin" type="button">SPIN</button>
          <span class="hint">PULL THE LEVER OR PRESS SPACE</span>
          <span class="slot" id="slot" aria-hidden="true"></span>
        </div>
      </div>
      <button class="lever" id="lever" type="button" aria-label="Pull the lever">
        <span class="base"></span>
        <span class="arm"><span class="stick" id="stick"></span><span class="knob" id="knob"></span><span class="pivot"></span></span>
      </button>
    </div>

    <div class="ticket-wrap">
      <article class="ticket" id="ticket" aria-label="Your event ticket">
        <div class="t-head"><span>ADMIT ONE</span><span id="tNo"></span></div>
        <h2 class="t-name" id="tName"></h2>
        <div class="stamp" id="tStamp" hidden></div>
        <dl class="t-rows" id="tRows"></dl>
        <p class="t-fine" id="tFine"></p>

  sizeFx();
  function burst(n) {
    if (reduced) return;
    var r = $("slot").getBoundingClientRect();
    for (var i = 0; i < n; i++) {
      parts.push({
        x: r.left + r.width / 2 + (Math.random() - 0.5) * r.width * 0.6,
        y: r.top,
        vx: (Math.random() - 0.5) * 10,
        vy: -(6 + Math.random() * 9),
        a: Math.random() * 6.28,
        va: (Math.random() - 0.5) * 0.3,
        s: 16 + Math.random() * 10
      });
    }
  }
  function rain(n) {
    if (reduced) return;
    for (var i = 0; i < n; i++) {
      parts.push({
        x: Math.random() * window.innerWidth,
        y: -30 - Math.random() * window.innerHeight * 0.9,
        vx: (Math.random() - 0.5) * 2,
        vy: 2 + Math.random() * 3,
        a: Math.random() * 6.28,
        va: (Math.random() - 0.5) * 0.2,
        s: 18 + Math.random() * 14
      });
    }
  }
  function drawDate(p) {
    var c = fxc, s = p.s * dpr;
    c.save();
    c.translate(p.x * dpr, p.y * dpr);
    c.rotate(p.a);
    var g = c.createLinearGradient(0, -s * 0.3, 0, s * 0.3);
    g.addColorStop(0, "#8a4520");
    g.addColorStop(0.55, "#5c2a12");
    g.addColorStop(1, "#3a170a");
    c.fillStyle = g;
    c.beginPath();
    c.ellipse(0, 0, s * 0.62, s * 0.32, 0, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = "rgba(20, 8, 2, 0.35)";
    c.lineWidth = Math.max(1, s * 0.04);
    c.beginPath();
    c.moveTo(-s * 0.3, -s * 0.06); c.quadraticCurveTo(-s * 0.1, s * 0.04, s * 0.12, -s * 0.05);
    c.moveTo(-s * 0.05, s * 0.12); c.quadraticCurveTo(s * 0.15, s * 0.2, s * 0.35, s * 0.08);
    c.stroke();
    c.fillStyle = "rgba(255, 210, 160, 0.35)";
    c.beginPath();
    c.ellipse(-s * 0.18, -s * 0.14, s * 0.22, s * 0.06, -0.15, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }
  function fxStep() {
    if (!parts.length) {
      if (fxDirty) { fxc.clearRect(0, 0, fx.width, fx.height); fxDirty = false; }
      return;
    }
    fxc.clearRect(0, 0, fx.width, fx.height);
    fxDirty = true;
    var H = window.innerHeight + 60;
    parts = parts.filter(function (p) {
      p.vy += 0.32;
      p.vx *= 0.995;
      p.x += p.vx;
      p.y += p.vy;
      p.a += p.va;
      if (p.y > -40) drawDate(p);
      return p.y < H;
    });
  }

  function loop(now) {
    lights(now);
    tickerStep(now);
    fxStep();
    requestAnimationFrame(loop);
  }

  var toastTimer;
  function say(msg, big, kicker) {
    toast.innerHTML = "";
    if (kicker) {
      var k = document.createElement("span");
      k.className = "kicker";
      k.textContent = kicker;
      toast.appendChild(k);
    }
    toast.appendChild(document.createTextNode(msg));
    toast.classList.toggle("big", !!big);
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, big ? 3400 : 1700);
  }

  var count = parseInt(store("mte-count") || "0", 10) || 0;
  function renderCount() { countEl.textContent = "No." + String(Math.min(count, 999)).padStart(3, "0"); }
  renderCount();

  var founded = [];
  function remember(t) {
    founded.unshift(t);
    founded = founded.slice(0, 6);
    historyList.innerHTML = "";
    founded.forEach(function (h) {
      var li = document.createElement("li");
      li.textContent = h.name;
      if (h.golden) li.className = "gold";
      historyList.appendChild(li);
    });
    historyBox.hidden = false;
  }

  var held = [false, false, false];
  holds.forEach(function (b) {
    b.addEventListener("click", function () {
      if (spinning) return;
      var i = +b.getAttribute("data-i");
      held[i] = !held[i];
      b.setAttribute("aria-pressed", String(held[i]));
      b.textContent = held[i] ? "HELD" : "HOLD";
      reels[i].win.classList.toggle("held", held[i]);
      blip(held[i] ? 880 : 520, 0.07, 0.05, "square");
    });
  });

  var current = null;
  var spinning = false;
  var statusTimer = null;

  function startStatuses() {
    var i = Math.floor(Math.random() * STATUSES.length);
    plate.classList.add("pending");
    plate.textContent = STATUSES[i] + "...";
    statusTimer = setInterval(function () {
      i = (i + 1) % STATUSES.length;
      plate.textContent = STATUSES[i] + "...";
    }, 420);
  }

  function setLever(f) {
    var L = knob.offsetParent ? parseFloat(getComputedStyle(stick).height) : 150;
    stick.style.transform = "scaleY(" + (1 - 2 * f).toFixed(3) + ")";
    knob.style.transform = "translateY(" + (2 * L * f).toFixed(1) + "px)";
  }
  function clearLever() { stick.style.transform = ""; knob.style.transform = ""; }
  function pullAnim() {
    lever.classList.remove("pulled");
    void lever.offsetWidth;
    lever.classList.add("pulled");
  }

  function spin() {
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;
    holds.forEach(function (b) { b.disabled = true; });
    machine.classList.remove("win");
    if (!reduced) {
      ticketEl.classList.remove("printing");
      void ticketEl.offsetWidth;
      ticketEl.classList.add("gone");
    }
    startStatuses();
    audio();

    var allHeld = held[0] && held[1] && held[2];
    var p0 = pos.slice();
    var dest = [0, 1, 2].map(function (i) {
      if (held[i]) return p0[i];
      var n = REELS[i].length;
      var step = 1 + Math.floor(Math.random() * (n - 1));
      return Math.round(p0[i]) + step + n * (reduced ? 0 : 2 + i);
    });
    var end = allHeld ? 0.9 : LEAD + SETTLE + Math.max.apply(null, [0, 1, 2].map(function (i) { return held[i] ? 0 : STOP[i]; }));
    var stopped = held.slice();
    var t0 = performance.now();
    var prev = p0.slice();
    reels.forEach(function (r, i) { r.lastTick = Math.round(p0[i]); });
    setMode("spin");

    function frame(now) {
      var t = (now - t0) / 1000;
      var tt = t - LEAD;
      var cur = [];
      for (var i = 0; i < 3; i++) {
        var p;
        if (held[i]) p = p0[i];
        else {
          var D = dest[i] - p0[i];
          if (tt <= 0) p = p0[i] - (reduced ? 0 : 0.18 * Math.sin(Math.max(0, t) / LEAD * Math.PI));
          else if (tt < STOP[i]) { var u = tt / STOP[i]; p = p0[i] + (D + OVER) * (1 - Math.pow(1 - u, 3)); }
          else if (tt < STOP[i] + SETTLE) { var v = (tt - STOP[i]) / SETTLE; p = dest[i] + OVER * (1 - v * v * (3 - 2 * v)); }
          else p = dest[i];
          if (!stopped[i] && tt >= STOP[i]) { stopped[i] = true; clunk(i); buzz(12); }
          var k = Math.round(p);
          if (k !== reels[i].lastTick) { reels[i].lastTick = k; if (!stopped[i]) tick(); }
        }
        cur.push(p);
      }
      var done = t >= end;
      for (var j = 0; j < 3; j++) draw(j, cur[j], cur[j] - prev[j], done);
      prev = cur;
      if (!done) { requestAnimationFrame(frame); return; }
      pos = dest.map(function (d, i) { return mod(d, REELS[i].length); });
      finish();
    }
    requestAnimationFrame(frame);
  }

  function finish() {
    clearInterval(statusTimer);
    var t = buildTicket(pos.slice(), Math.floor(Math.random() * 2147483647));
    current = t;
    machine.classList.add("win");
    setMode("win");
    plate.classList.remove("pending");
    plate.textContent = t.name;
    redraw();
    fanfare(t.golden);
    burst(t.golden ? 40 : 16);
    if (t.golden) { rain(150); say("The chai comes to you now", true, "GOLDEN TICKET"); buzz([30, 40, 30, 40, 60]); }
    noticeQueue.push("NOW BOOKING: " + t.name.toUpperCase());
    try { window.history.replaceState(null, "", "?t=" + t.idx.join(".") + "." + t.seed.toString(36)); } catch (e) {}

    setTimeout(function () {
      renderTicket(t);
      ticketEl.classList.remove("gone");
      if (!reduced) {
        void ticketEl.offsetWidth;
        ticketEl.classList.add("printing");
        printSound();
        tStamp.classList.remove("slam");
        tStamp.style.visibility = "hidden";
        setTimeout(function () {
          tStamp.style.visibility = "";
          void tStamp.offsetWidth;
          tStamp.classList.add("slam");
          if (t.stamp) blip(90, 0.16, 0.18, "triangle");
        }, 1100);
      }
      count++;
      store("mte-count", String(count));
      renderCount();
      remember(t);
      if (MILESTONES[count] && !t.golden) {
        setTimeout(function () {
          say(MILESTONES[count], true, count + " EVENTS FOUNDED");
          blip(1568, 0.25, 0.05, "square");
          blip(2093, 0.3, 0.05, "square", 0.12);
        }, reduced ? 200 : 1300);
      }
      spinning = false;
      spinBtn.disabled = false;
      holds.forEach(function (b) { b.disabled = false; });
    }, reduced ? 0 : 280);
  }

  spinBtn.addEventListener("click", spin);

  var drag = null;
  lever.addEventListener("pointerdown", function (e) {
    if (spinning || e.button > 0) return;
    drag = { y: e.clientY, f: 0, moved: false };
    try { lever.setPointerCapture(e.pointerId); } catch (err) {}
    lever.classList.remove("releasing", "pulled");
  });
  lever.addEventListener("pointermove", function (e) {
    if (!drag) return;
    var dy = e.clientY - drag.y;
    if (Math.abs(dy) > 5) drag.moved = true;
    var L = parseFloat(getComputedStyle(stick).height) || 150;
    drag.f = Math.max(0, Math.min(1, dy / (2 * L)));
    if (drag.moved) setLever(drag.f);
  });
  function endDrag(cancelled) {
    if (!drag) return;
    var d = drag;
    drag = null;
    if (!d.moved) {
      clearLever();
      if (!cancelled) { pullAnim(); spin(); }
      return;
    }
    lever.classList.add("releasing");
    setLever(0);
    setTimeout(function () { lever.classList.remove("releasing"); clearLever(); }, 420);
    if (!cancelled && d.f > 0.42) spin();
  }
  lever.addEventListener("pointerup", function () { endDrag(false); });
  lever.addEventListener("pointercancel", function () { endDrag(true); });
  lever.addEventListener("click", function (e) { if (e.detail === 0) { pullAnim(); spin(); } });

  document.addEventListener("keydown", function (e) {
    if (e.target.closest && e.target.closest("a, button")) return;
    if (e.code === "Space" || e.key === "Enter") {
      e.preventDefault();
      spinBtn.classList.add("pressed");
      if (!spinning) pullAnim();
      spin();
    } else if (e.key === "1" || e.key === "2" || e.key === "3") {
      holds[+e.key - 1].click();
    }
  });
  document.addEventListener("keyup", function () { spinBtn.classList.remove("pressed"); });

  copyBtn.addEventListener("click", function () {
    if (!current) return;
    var url = ticketUrl(current);
    var done = function () { say("Link copied"); };
    var fallback = function () { window.prompt ? window.prompt("Copy this link", url) : say(url); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, fallback);
    else fallback();
  });

  function wrap(c, text, maxW) {
    var words = text.split(" "), lines = [], line = "";
    words.forEach(function (w) {
      var test = line ? line + " " + w : w;
      if (c.measureText(test).width > maxW && line) { lines.push(line); line = w; }
      else line = test;
    });
    if (line) lines.push(line);
    return lines;
  }
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function ticketImage(t) {
    var W = 1080, H = 1350;
    var cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    var c = cv.getContext("2d");
    var bg = c.createRadialGradient(W / 2, 260, 40, W / 2, 400, 900);
    bg.addColorStop(0, "#3b1a34");
    bg.addColorStop(1, "#15101c");
    c.fillStyle = bg;
    c.fillRect(0, 0, W, H);

    c.textAlign = "center";
    c.fillStyle = "#f2c14e";
    c.font = '84px Anton, Impact, sans-serif';
    c.fillText("MUSLIM TECH", W / 2, 128);
    c.fillStyle = "#f7efdd";
    c.font = '46px "Bebas Neue", sans-serif';
    c.fillText("EVENT GENERATOR", W / 2, 180);

    var x = 100, w = 880, pad = 56, y = 232;
    var labelW = 210, valX = x + pad + labelW, valW = w - pad * 2 - labelW;
    var nameSize = 92;
    c.font = nameSize + 'px Anton, Impact, sans-serif';
    var nameLines = wrap(c, t.name.toUpperCase(), w - pad * 2 - 150);
    while (nameLines.length > 2 && nameSize > 60) {
      nameSize -= 6;
      c.font = nameSize + 'px Anton, Impact, sans-serif';
      nameLines = wrap(c, t.name.toUpperCase(), w - pad * 2 - 150);
    }
    c.font = '31px "Courier Prime", monospace';
    var rowLines = ROWS.map(function (r) { return wrap(c, t[r[1]], valW); });
    c.font = 'italic 27px "Courier Prime", monospace';
    var fineLines = wrap(c, t.fine, w - pad * 2);
    var h = 40 + 56 + 30 + nameLines.length * nameSize * 1.02 + 30;
    rowLines.forEach(function (l) { h += l.length * 40 + 16; });
    h += 18 + fineLines.length * 36 + 40 + 110 + 30;

    c.save();
    c.shadowColor = "rgba(0,0,0,0.5)";
    c.shadowBlur = 40;
    c.shadowOffsetY = 18;
    rr(c, x, y, w, h, 16);
    if (t.golden) {
      var gg = c.createLinearGradient(x, y, x + w, y + h);
      gg.addColorStop(0, "#e9b949"); gg.addColorStop(0.3, "#f7d97e"); gg.addColorStop(0.5, "#fff3c4");
      gg.addColorStop(0.7, "#f2c14e"); gg.addColorStop(1, "#d9a13a");
      c.fillStyle = gg;
    } else c.fillStyle = "#fbf4e3";
    c.fill();
    c.restore();

    var cy = y + 40;
    c.textAlign = "left";
    c.fillStyle = "#c4122f";
    c.font = '40px "Bebas Neue", sans-serif';
    c.fillText("ADMIT ONE", x + pad, cy + 34);
    c.textAlign = "right";
    c.fillText("No. " + t.no, x + w - pad, cy + 34);
    c.fillRect(x + pad, cy + 50, w - pad * 2, 4);
    cy += 56 + 30;

    c.textAlign = "left";
    c.fillStyle = "#1b1522";
    c.font = nameSize + 'px Anton, Impact, sans-serif';
    nameLines.forEach(function (l) { cy += nameSize * 1.02; c.fillText(l, x + pad, cy - nameSize * 0.12); });
    cy += 30;

    ROWS.forEach(function (r, i) {
      c.fillStyle = "#c4122f";
      c.font = '36px "Bebas Neue", sans-serif';
      c.fillText(r[0], x + pad, cy + 30);
      c.fillStyle = "#1b1522";
      c.font = '31px "Courier Prime", monospace';
      rowLines[i].forEach(function (l, k) { c.fillText(l, valX, cy + 30 + k * 40); });
      cy += rowLines[i].length * 40 + 16;
    });
    cy += 18;
    c.fillStyle = "rgba(27,21,34,0.72)";
    c.font = 'italic 27px "Courier Prime", monospace';
    fineLines.forEach(function (l) { cy += 36; c.fillText(l, x + pad, cy - 8); });
    cy += 40;

    c.save();
    c.strokeStyle = "rgba(27,21,34,0.3)";
    c.lineWidth = 3;
    c.setLineDash([14, 10]);
    c.beginPath(); c.moveTo(x + 20, cy); c.lineTo(x + w - 20, cy); c.stroke();
    c.restore();
    c.fillStyle = "#1e1426";
    c.beginPath(); c.arc(x, cy, 18, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(x + w, cy, 18, 0, Math.PI * 2); c.fill();

    var bx = x + pad;
    c.fillStyle = "#1b1522";
    t.bars.forEach(function (bw) { c.fillRect(bx, cy + 30, bw * 3, 78); bx += bw * 3 + 5; });
    c.textAlign = "right";
    c.fillStyle = "rgba(27,21,34,0.7)";
    c.font = '32px "Bebas Neue", sans-serif';
    c.fillText("MUSLIM TECH", x + w - pad, cy + 72);
    c.fillText("EVENT GENERATOR", x + w - pad, cy + 104);

    if (t.stamp) {
      c.save();
      c.translate(x + w * 0.52, cy + 70);
      c.rotate(-0.12);
      c.globalAlpha = 0.9;
      c.font = '30px "Archivo Black", sans-serif';
      var sw = Math.min(260, c.measureText(t.stamp).width) + 36;
      c.strokeStyle = "#c4122f";
      c.lineWidth = 6;
      rr(c, -sw / 2, -30, sw, 60, 10);
      c.stroke();
      c.fillStyle = "#c4122f";
      c.textAlign = "center";
      c.fillText(t.stamp, 0, 11, 260);
      c.restore();
    }

    c.textAlign = "center";
    c.fillStyle = "rgba(247,239,221,0.75)";
    c.font = '34px "Bebas Neue", sans-serif';
    c.fillText(SITE.replace(/^https?:\/\//, "").replace(/\/$/, "").toUpperCase(), W / 2, Math.min(H - 40, y + h + 70));
    return cv;
  }

  saveBtn.addEventListener("click", function () {
    if (!current) return;
    var t = current;
    var fonts = ['100px Anton', '40px "Bebas Neue"', '31px "Courier Prime"', 'italic 27px "Courier Prime"', '30px "Archivo Black"'];
    var ready = document.fonts && document.fonts.load ? Promise.all(fonts.map(function (f) { return document.fonts.load(f); })) : Promise.resolve();
    ready.catch(function () {}).then(function () {
      var cv = ticketImage(t);
      cv.toBlob(function (blob) {
        if (!blob) { say("Couldn't make the image"); return; }
        var file = new File([blob], "muslim-tech-ticket.png", { type: "image/png" });
        var touch = window.matchMedia("(pointer: coarse)").matches;
        if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: t.name }).catch(function () {});
          return;
        }
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "muslim-tech-ticket.png";
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        say("Ticket saved");
      }, "image/png");
    });
  });

  window.addEventListener("resize", function () { sizeFx(); layoutBulbs(); if (!spinning) redraw(); });

  var start = parseUrl() || { idx: [REELS[0].indexOf("Barakah"), REELS[1].indexOf("Fintech"), REELS[2].indexOf("Collective")], seed: 2026 };
  pos = start.idx.slice();
  current = buildTicket(start.idx, start.seed);
  plate.textContent = current.name;
  renderTicket(current);
  machine.classList.add("win");
  layoutBulbs();
  redraw();
  nextNotice();
  requestAnimationFrame(loop);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { sizeCache = {}; layoutBulbs(); redraw(); tickerW = tickerText.offsetWidth; });
  }
})();
</script>
